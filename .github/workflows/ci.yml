name: CI

on:
  workflow_dispatch:
    inputs:
      apps_script_url:
        description: Deployed PandaWise Google Apps Script Web App URL ending in /exec
        required: true
        type: string
  pull_request:
  push:
    branches:
      - main
      - "agent/**"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apps-script:
    name: Apps Script checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Package Sprint 11 source ZIP
        run: git archive --format=zip --output=pandawise-sprint-11-source.zip HEAD
      - name: Upload source ZIP
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pandawise-sprint-11-source
          path: pandawise-sprint-11-source.zip
          if-no-files-found: error
          retention-days: 30

  mobile:
    name: Flutter checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.0
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  security:
    name: Security checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run security:scan
      - name: Secret scan
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: false
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: false

  android:
    name: Functional Android APK
    if: >-
      ${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.apps_script_url != '') ||
          vars.PANDAWISE_APPS_SCRIPT_URL != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/mobile
    env:
      PANDAWISE_APPS_SCRIPT_URL: >-
        ${{ github.event.inputs.apps_script_url || vars.PANDAWISE_APPS_SCRIPT_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.0
          cache: true
      - name: Validate Apps Script deployment URL
        run: |
          case "$PANDAWISE_APPS_SCRIPT_URL" in
            https://script.google.com/macros/s/*/exec) ;;
            *) echo "A deployed Google Apps Script /exec URL is required." >&2; exit 1 ;;
          esac
      - name: Generate Android runner when absent
        run: |
          if [ ! -d android ]; then
            pandawise_runner_dir="$(mktemp -d)"
            flutter create --platforms=android --org com.pandawise --project-name pandawise_mobile "$pandawise_runner_dir"
            cp -R "$pandawise_runner_dir/android" .
          fi
      - run: flutter pub get
      - name: Build debug-signed functional APK
        run: >-
          flutter build apk --debug
          --dart-define=PANDAWISE_APPS_SCRIPT_URL="$PANDAWISE_APPS_SCRIPT_URL"
      - name: Record artifact evidence
        run: |
          pandawise_artifact_dir="build/app/outputs/flutter-apk"
          sha256sum "$pandawise_artifact_dir/app-debug.apk" > "$pandawise_artifact_dir/app-debug.apk.sha256"
          pandawise_apk_checksum="$(cut -d ' ' -f1 "$pandawise_artifact_dir/app-debug.apk.sha256")"
          flutter --version > "$pandawise_artifact_dir/flutter-version.txt"
          {
            echo "product=PandaWise"
            echo "sprint=11"
            echo "commit=$GITHUB_SHA"
            echo "ref=$GITHUB_REF_NAME"
            echo "workflow_run=$GITHUB_RUN_ID"
            echo "apps_script_url=$PANDAWISE_APPS_SCRIPT_URL"
            echo "apk_sha256=$pandawise_apk_checksum"
            echo "built_at_utc=$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          } > "$pandawise_artifact_dir/sprint-11-manifest.txt"
      - name: Upload functional APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pandawise-sprint-11-android
          path: |
            apps/mobile/build/app/outputs/flutter-apk/app-debug.apk
            apps/mobile/build/app/outputs/flutter-apk/app-debug.apk.sha256
            apps/mobile/build/app/outputs/flutter-apk/flutter-version.txt
            apps/mobile/build/app/outputs/flutter-apk/sprint-11-manifest.txt
          if-no-files-found: error
          retention-days: 30
