name: CI

on:
  workflow_dispatch:
    inputs:
      api_base_url:
        description: Non-secret pilot API base URL embedded in the debug APK
        required: true
        type: string
  pull_request:
  push:
    branches:
      - main
      - "agent/**"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check

  mobile:
    name: Flutter checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.0
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  security:
    name: Security checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run security:scan
      - name: Secret scan
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: false
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: false

  android-pilot:
    name: Android pilot artifact
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.0
          cache: true
      - name: Generate Android runner when absent
        run: |
          if [ ! -d android ]; then
            pandawise_runner_dir="$(mktemp -d)"
            flutter create --platforms=android --org com.pandawise --project-name pandawise_mobile "$pandawise_runner_dir"
            cp -R "$pandawise_runner_dir/android" .
          fi
      - run: flutter pub get
      - name: Build debug-signed pilot APK
        env:
          PANDAWISE_PILOT_API_BASE_URL: ${{ github.event.inputs.api_base_url || 'https://api.invalid.pandawise.example' }}
        run: flutter build apk --debug --dart-define=PANDAWISE_API_BASE_URL="$PANDAWISE_PILOT_API_BASE_URL"
      - name: Record APK checksum
        run: sha256sum build/app/outputs/flutter-apk/app-debug.apk > build/app/outputs/flutter-apk/app-debug.apk.sha256
      - name: Create pilot artifact manifest
        env:
          PANDAWISE_PILOT_API_BASE_URL: ${{ github.event.inputs.api_base_url || 'https://api.invalid.pandawise.example' }}
        run: |
          pandawise_artifact_dir="build/app/outputs/flutter-apk"
          pandawise_apk_checksum="$(cut -d ' ' -f1 "$pandawise_artifact_dir/app-debug.apk.sha256")"
          flutter --version > "$pandawise_artifact_dir/flutter-version.txt"
          {
            echo "product=PandaWise"
            echo "release=1.0.0-rc.1"
            echo "commit=$GITHUB_SHA"
            echo "ref=$GITHUB_REF_NAME"
            echo "workflow_run=$GITHUB_RUN_ID"
            echo "api_base_url=$PANDAWISE_PILOT_API_BASE_URL"
            echo "apk_sha256=$pandawise_apk_checksum"
            echo "built_at_utc=$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          } > "$pandawise_artifact_dir/pilot-manifest.txt"
      - name: Upload pilot APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pandawise-1.0.0-pilot-android
          path: |
            apps/mobile/build/app/outputs/flutter-apk/app-debug.apk
            apps/mobile/build/app/outputs/flutter-apk/app-debug.apk.sha256
            apps/mobile/build/app/outputs/flutter-apk/flutter-version.txt
            apps/mobile/build/app/outputs/flutter-apk/pilot-manifest.txt
          if-no-files-found: error
          retention-days: 30
