openapi: 3.1.0
info:
  title: PandaWise API
  version: 0.1.0
  description: Sprint 1 contract for parent authentication, configuration and child profiles.
servers:
  - url: http://localhost:8080
paths:
  /health:
    get:
      operationId: getHealth
      responses:
        "200":
          description: Service is healthy.
          content:
            application/json:
              schema:
                type: object
                required: [status, service, version]
                properties:
                  status: { const: ok }
                  service: { const: pandawise-api }
                  version: { type: string }
  /v1/config/bootstrap:
    get:
      operationId: getBootstrapConfiguration
      responses:
        "200":
          description: Public, non-sensitive master options needed by onboarding.
          content:
            application/json:
              schema:
                type: object
                required: [version, data]
                properties:
                  version: { type: string }
                  data:
                    $ref: "#/components/schemas/BootstrapData"
  /v1/auth/register:
    post:
      operationId: registerParent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterParentRequest"
      responses:
        "201":
          description: Parent account created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400": { $ref: "#/components/responses/ValidationError" }
        "409": { $ref: "#/components/responses/ConflictError" }
  /v1/auth/login:
    post:
      operationId: loginParent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string }
      responses:
        "200":
          description: Parent authenticated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401": { $ref: "#/components/responses/UnauthorizedError" }
  /v1/auth/forgot-password:
    post:
      operationId: requestPasswordReset
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        "202":
          description: Generic acceptance response; does not disclose account existence.
  /v1/me:
    get:
      operationId: getCurrentParent
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Current parent profile.
          content:
            application/json:
              schema:
                type: object
                required: [parent]
                properties:
                  parent: { $ref: "#/components/schemas/Parent" }
        "401": { $ref: "#/components/responses/UnauthorizedError" }
  /v1/children:
    get:
      operationId: listChildren
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Active children owned by the current parent.
          content:
            application/json:
              schema:
                type: object
                required: [children]
                properties:
                  children:
                    type: array
                    items: { $ref: "#/components/schemas/Child" }
    post:
      operationId: createChild
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateChildRequest"
      responses:
        "201":
          description: Child profile created.
          content:
            application/json:
              schema:
                type: object
                required: [child]
                properties:
                  child: { $ref: "#/components/schemas/Child" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "403":
          description: Plan child-profile limit reached.
  /v1/children/{childId}:
    get:
      operationId: getChild
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: childId
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Child profile owned by the current parent.
          content:
            application/json:
              schema:
                type: object
                required: [child]
                properties:
                  child: { $ref: "#/components/schemas/Child" }
        "404": { $ref: "#/components/responses/NotFoundError" }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    ValidationError:
      description: Request validation failed.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    UnauthorizedError:
      description: Authentication is missing or invalid.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    ConflictError:
      description: A conflicting account or resource already exists.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    NotFoundError:
      description: The resource does not exist for this parent.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
  schemas:
    Parent:
      type: object
      required:
        - id
        - name
        - parentType
        - mobileNumber
        - email
        - subscriptionPlanId
        - preferredLanguageId
        - dailyTimeCommitment
      properties:
        id: { type: string }
        name: { type: string }
        parentType:
          enum: [Mother, Father, Guardian, Grandparent]
        mobileNumber: { type: string }
        email: { type: string, format: email }
        subscriptionPlanId: { enum: [PLN001, PLN002, PLN003] }
        preferredLanguageId: { type: string }
        dailyTimeCommitment:
          $ref: "#/components/schemas/TimeCommitment"
    Child:
      type: object
      required:
        - id
        - parentId
        - name
        - dateOfBirth
        - ageYears
        - ageGroupId
        - gender
        - languageId
        - assessmentStatus
        - journeyStatus
        - currentBadgeLevel
        - currentStreak
      properties:
        id: { type: string }
        parentId: { type: string }
        name: { type: string }
        nickname: { type: string }
        avatarId: { type: string }
        dateOfBirth: { type: string, format: date }
        ageYears: { type: integer, minimum: 3, maximum: 12 }
        ageGroupId: { enum: [AG01, AG02, AG03] }
        gender: { enum: [Boy, Girl, Prefer Not to Say] }
        schoolId: { type: string }
        gradeId: { type: string }
        languageId: { type: string }
        assessmentStatus:
          enum: [Not Started, In Progress, Completed, Reassessment Due]
        journeyStatus: { enum: [Not Started, Active, Paused, Completed] }
        currentGrowScore: { type: number, minimum: 0, maximum: 100 }
        currentBadgeLevel: { enum: [Starter, Explorer, Achiever, Champion] }
        currentStreak: { type: integer, minimum: 0 }
    AuthResponse:
      type: object
      required: [token, parent]
      properties:
        token: { type: string }
        parent: { $ref: "#/components/schemas/Parent" }
    RegisterParentRequest:
      type: object
      required: [name, mobileNumber, email, password, termsAccepted]
      properties:
        name: { type: string, minLength: 2, maxLength: 100 }
        parentType:
          enum: [Mother, Father, Guardian, Grandparent]
          default: Guardian
        mobileNumber: { type: string, minLength: 8, maxLength: 20 }
        email: { type: string, format: email }
        password: { type: string, minLength: 8, maxLength: 72 }
        preferredLanguageId: { type: string, default: LNG001 }
        dailyTimeCommitment:
          $ref: "#/components/schemas/TimeCommitment"
        termsAccepted: { const: true }
        marketingConsent: { type: boolean, default: false }
    CreateChildRequest:
      type: object
      required: [name, dateOfBirth, gender, languageId, parentTimeCommitment]
      properties:
        name: { type: string, minLength: 2, maxLength: 100 }
        nickname: { type: string, maxLength: 60 }
        avatarId: { type: string, maxLength: 80 }
        dateOfBirth: { type: string, format: date }
        gender: { enum: [Boy, Girl, Prefer Not to Say] }
        schoolId: { type: string }
        gradeId: { type: string }
        languageId: { type: string }
        knownInterests:
          type: array
          maxItems: 5
          items: { type: string }
        parentTimeCommitment:
          $ref: "#/components/schemas/TimeCommitment"
    BootstrapData:
      type: object
      required: [ageGroups, languages, schools, grades, skills, passions, timeCommitments]
      properties:
        ageGroups: { $ref: "#/components/schemas/MasterOptions" }
        languages: { $ref: "#/components/schemas/MasterOptions" }
        schools: { $ref: "#/components/schemas/MasterOptions" }
        grades: { $ref: "#/components/schemas/MasterOptions" }
        skills: { $ref: "#/components/schemas/MasterOptions" }
        passions: { $ref: "#/components/schemas/MasterOptions" }
        timeCommitments:
          type: array
          items: { $ref: "#/components/schemas/TimeCommitment" }
    MasterOptions:
      type: array
      items:
        type: object
        required: [id, name]
        properties:
          id: { type: string }
          name: { type: string }
        additionalProperties: true
    TimeCommitment:
      enum: [10_MIN, 15_MIN, 20_MIN, 30_MIN, WEEKENDS_ONLY]
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string }
            details: { type: array }
