openapi: 3.1.0
info:
  title: PandaWise API
  version: 0.4.0
  description: Sprint 1–4 contract for onboarding, GrowScore, journeys, progress and reassessment.
servers:
  - url: http://localhost:8080
paths:
  /health:
    get:
      operationId: getHealth
      responses:
        "200":
          description: Service is healthy.
          content:
            application/json:
              schema:
                type: object
                required: [status, service, version]
                properties:
                  status: { const: ok }
                  service: { const: pandawise-api }
                  version: { type: string }
  /v1/config/bootstrap:
    get:
      operationId: getBootstrapConfiguration
      responses:
        "200":
          description: Public, non-sensitive master options needed by onboarding.
          content:
            application/json:
              schema:
                type: object
                required: [version, data]
                properties:
                  version: { type: string }
                  data:
                    $ref: "#/components/schemas/BootstrapData"
  /v1/auth/register:
    post:
      operationId: registerParent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterParentRequest"
      responses:
        "201":
          description: Parent account created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400": { $ref: "#/components/responses/ValidationError" }
        "409": { $ref: "#/components/responses/ConflictError" }
  /v1/auth/login:
    post:
      operationId: loginParent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string }
      responses:
        "200":
          description: Parent authenticated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401": { $ref: "#/components/responses/UnauthorizedError" }
  /v1/auth/forgot-password:
    post:
      operationId: requestPasswordReset
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        "202":
          description: Generic acceptance response; does not disclose account existence.
  /v1/me:
    get:
      operationId: getCurrentParent
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Current parent profile.
          content:
            application/json:
              schema:
                type: object
                required: [parent]
                properties:
                  parent: { $ref: "#/components/schemas/Parent" }
        "401": { $ref: "#/components/responses/UnauthorizedError" }
  /v1/children:
    get:
      operationId: listChildren
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Active children owned by the current parent.
          content:
            application/json:
              schema:
                type: object
                required: [children]
                properties:
                  children:
                    type: array
                    items: { $ref: "#/components/schemas/Child" }
    post:
      operationId: createChild
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateChildRequest"
      responses:
        "201":
          description: Child profile created.
          content:
            application/json:
              schema:
                type: object
                required: [child]
                properties:
                  child: { $ref: "#/components/schemas/Child" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "403":
          description: Plan child-profile limit reached.
  /v1/children/{childId}:
    get:
      operationId: getChild
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: childId
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Child profile owned by the current parent.
          content:
            application/json:
              schema:
                type: object
                required: [child]
                properties:
                  child: { $ref: "#/components/schemas/Child" }
        "404": { $ref: "#/components/responses/NotFoundError" }
  /v1/children/{childId}/passions:
    parameters:
      - in: path
        name: childId
        required: true
        schema: { type: string }
    get:
      operationId: getChildPassions
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Current non-scored Passion Discovery selections.
          content:
            application/json:
              schema:
                type: object
                required: [passionIds]
                properties:
                  passionIds:
                    type: array
                    items: { type: string }
    put:
      operationId: selectChildPassions
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [passionIds]
              properties:
                passionIds:
                  type: array
                  minItems: 1
                  maxItems: 5
                  uniqueItems: true
                  items: { type: string }
      responses:
        "200": { description: Passion selections saved. }
        "400": { $ref: "#/components/responses/ValidationError" }
        "404": { $ref: "#/components/responses/NotFoundError" }
  /v1/children/{childId}/assessments:
    post:
      operationId: startOrResumeAssessment
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: childId
          required: true
          schema: { type: string }
      responses:
        "201":
          description: A versioned Development Check was started or resumed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AssessmentDetail" }
        "403": { description: Annual plan entitlement reached. }
        "409": { description: Passion Discovery is incomplete. }
  /v1/children/{childId}/growscore/latest:
    get:
      operationId: getLatestGrowScoreReport
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: childId
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Latest completed GrowScore report for the child.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GrowScoreReport" }
        "404": { $ref: "#/components/responses/NotFoundError" }
  /v1/children/{childId}/progress:
    get:
      operationId: getChildProgress
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: childId
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Plan-filtered assessment growth, mission activity, skill trends and history.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChildProgressView" }
        "404": { $ref: "#/components/responses/NotFoundError" }
  /v1/assessments/{assessmentId}:
    get:
      operationId: getAssessment
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: assessmentId
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Development Check questions, selections and progress.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AssessmentDetail" }
        "404": { $ref: "#/components/responses/NotFoundError" }
  /v1/assessments/{assessmentId}/responses/{questionId}:
    put:
      operationId: autoSaveAssessmentResponse
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: assessmentId
          required: true
          schema: { type: string }
        - in: path
          name: questionId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [optionId]
              properties:
                optionId: { type: string }
                responseText: { type: string, maxLength: 500 }
      responses:
        "200": { description: Response validated, scored server-side and saved. }
        "409": { description: Assessment is already complete. }
  /v1/assessments/{assessmentId}/complete:
    post:
      operationId: completeAssessment
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: assessmentId
          required: true
          schema: { type: string }
      responses:
        "200":
          description: GrowScore calculated using scoring version 1.0.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GrowScoreReport" }
        "409": { description: Required questions remain unanswered. }
  /v1/assessments/{assessmentId}/report:
    get:
      operationId: getGrowScoreReport
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: assessmentId
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Plan-aware, strengths-first GrowScore report.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GrowScoreReport" }
        "409": { description: Assessment is not complete. }
  /v1/children/{childId}/journeys:
    post:
      operationId: createOrResumeJourney
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: childId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [focusSkillIds]
              properties:
                focusSkillIds:
                  type: array
                  minItems: 1
                  maxItems: 3
                  uniqueItems: true
                  items: { type: string }
      responses:
        "201":
          description: An explainable, plan-aware journey was generated or resumed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JourneyView" }
        "409": { description: A completed Development Check and GrowScore are required. }
        "503": { description: Active mission content is incomplete. }
  /v1/children/{childId}/journeys/current:
    get:
      operationId: getCurrentJourney
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: childId
          required: true
          schema: { type: string }
      responses:
        "200":
          description: The current or latest journey with only the available daily mission visible.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JourneyView" }
        "404": { $ref: "#/components/responses/NotFoundError" }
  /v1/journeys/{journeyId}:
    get:
      operationId: getJourney
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: journeyId
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Journey overview and current mission.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JourneyView" }
        "404": { $ref: "#/components/responses/NotFoundError" }
  /v1/journeys/{journeyId}/schedules/{scheduleId}/completion:
    put:
      operationId: submitMissionFeedback
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: journeyId
          required: true
          schema: { type: string }
        - in: path
          name: scheduleId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status, enjoymentScore, difficultyFeedback]
              properties:
                status: { enum: [YES, PARTIALLY, NO] }
                enjoymentScore: { type: integer, minimum: 1, maximum: 5 }
                difficultyFeedback: { enum: [TOO_EASY, JUST_RIGHT, CHALLENGING] }
                parentNotes: { type: string, maxLength: 500 }
      responses:
        "200":
          description: Feedback saved and the next daily mission unlocked.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JourneyView" }
        "409": { description: Mission is locked, already submitted or the journey is inactive. }
  /v1/journeys/{journeyId}/weekly-summary/{week}:
    get:
      operationId: getWeeklyJourneySummary
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: journeyId
          required: true
          schema: { type: string }
        - in: path
          name: week
          required: true
          schema: { type: integer, minimum: 1, maximum: 3 }
      responses:
        "200":
          description: Seven-day completion, enjoyment, points, streak and skill summary.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WeeklyJourneySummary" }
        "403": { description: Weekly summaries are not included in the current plan. }
        "409": { description: The seven daily check-ins are incomplete. }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    ValidationError:
      description: Request validation failed.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    UnauthorizedError:
      description: Authentication is missing or invalid.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    ConflictError:
      description: A conflicting account or resource already exists.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    NotFoundError:
      description: The resource does not exist for this parent.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
  schemas:
    Parent:
      type: object
      required:
        - id
        - name
        - parentType
        - mobileNumber
        - email
        - subscriptionPlanId
        - preferredLanguageId
        - dailyTimeCommitment
      properties:
        id: { type: string }
        name: { type: string }
        parentType:
          enum: [Mother, Father, Guardian, Grandparent]
        mobileNumber: { type: string }
        email: { type: string, format: email }
        subscriptionPlanId: { enum: [PLN001, PLN002, PLN003] }
        preferredLanguageId: { type: string }
        dailyTimeCommitment:
          $ref: "#/components/schemas/TimeCommitment"
    Child:
      type: object
      required:
        - id
        - parentId
        - name
        - dateOfBirth
        - ageYears
        - ageGroupId
        - gender
        - languageId
        - assessmentStatus
        - journeyStatus
        - currentBadgeLevel
        - currentStreak
      properties:
        id: { type: string }
        parentId: { type: string }
        name: { type: string }
        nickname: { type: string }
        avatarId: { type: string }
        dateOfBirth: { type: string, format: date }
        ageYears: { type: integer, minimum: 3, maximum: 12 }
        ageGroupId: { enum: [AG01, AG02, AG03] }
        gender: { enum: [Boy, Girl, Prefer Not to Say] }
        schoolId: { type: string }
        gradeId: { type: string }
        languageId: { type: string }
        assessmentStatus:
          enum: [Not Started, In Progress, Completed, Reassessment Due]
        journeyStatus: { enum: [Not Started, Active, Paused, Completed] }
        currentGrowScore: { type: number, minimum: 0, maximum: 100 }
        currentBadgeLevel: { enum: [Starter, Explorer, Achiever, Champion] }
        currentStreak: { type: integer, minimum: 0 }
    AuthResponse:
      type: object
      required: [token, parent]
      properties:
        token: { type: string }
        parent: { $ref: "#/components/schemas/Parent" }
    RegisterParentRequest:
      type: object
      required: [name, mobileNumber, email, password, termsAccepted]
      properties:
        name: { type: string, minLength: 2, maxLength: 100 }
        parentType:
          enum: [Mother, Father, Guardian, Grandparent]
          default: Guardian
        mobileNumber: { type: string, minLength: 8, maxLength: 20 }
        email: { type: string, format: email }
        password: { type: string, minLength: 8, maxLength: 72 }
        preferredLanguageId: { type: string, default: LNG001 }
        dailyTimeCommitment:
          $ref: "#/components/schemas/TimeCommitment"
        termsAccepted: { const: true }
        marketingConsent: { type: boolean, default: false }
    CreateChildRequest:
      type: object
      required: [name, dateOfBirth, gender, languageId, parentTimeCommitment]
      properties:
        name: { type: string, minLength: 2, maxLength: 100 }
        nickname: { type: string, maxLength: 60 }
        avatarId: { type: string, maxLength: 80 }
        dateOfBirth: { type: string, format: date }
        gender: { enum: [Boy, Girl, Prefer Not to Say] }
        schoolId: { type: string }
        gradeId: { type: string }
        languageId: { type: string }
        knownInterests:
          type: array
          maxItems: 5
          items: { type: string }
        parentTimeCommitment:
          $ref: "#/components/schemas/TimeCommitment"
    BootstrapData:
      type: object
      required: [ageGroups, languages, schools, grades, skills, passions, timeCommitments]
      properties:
        ageGroups: { $ref: "#/components/schemas/MasterOptions" }
        languages: { $ref: "#/components/schemas/MasterOptions" }
        schools: { $ref: "#/components/schemas/MasterOptions" }
        grades: { $ref: "#/components/schemas/MasterOptions" }
        skills: { $ref: "#/components/schemas/MasterOptions" }
        passions: { $ref: "#/components/schemas/MasterOptions" }
        timeCommitments:
          type: array
          items: { $ref: "#/components/schemas/TimeCommitment" }
    MasterOptions:
      type: array
      items:
        type: object
        required: [id, name]
        properties:
          id: { type: string }
          name: { type: string }
        additionalProperties: true
    TimeCommitment:
      enum: [10_MIN, 15_MIN, 20_MIN, 30_MIN, WEEKENDS_ONLY]
    AssessmentDetail:
      type: object
      required: [assessment, child, questions, progress]
      properties:
        assessment:
          type: object
          required: [id, childId, version, depth, respondentMode, status, questionCount]
          properties:
            id: { type: string }
            childId: { type: string }
            version: { const: "1.0" }
            depth: { enum: [CORE, COMPREHENSIVE] }
            respondentMode: { enum: [PARENT, HYBRID] }
            status: { enum: [In Progress, Completed] }
            questionCount: { enum: [30, 50] }
        child:
          type: object
          additionalProperties: true
        questions:
          type: array
          items:
            type: object
            required: [id, skillId, text, respondentType, options]
            properties:
              id: { type: string }
              skillId: { type: string }
              text: { type: string }
              respondentType: { enum: [PARENT, CHILD] }
              selectedOptionId: { type: [string, "null"] }
              options:
                type: array
                items:
                  type: object
                  required: [id, text]
                  properties:
                    id: { type: string }
                    text: { type: string }
        progress:
          type: object
          required: [answered, total, percent]
          properties:
            answered: { type: integer, minimum: 0 }
            total: { enum: [30, 50] }
            percent: { type: integer, minimum: 0, maximum: 100 }
    GrowScoreSkill:
      type: object
      required: [skillId, name, score, band, bandLabel, message]
      properties:
        skillId: { type: string }
        name: { type: string }
        score: { type: number, minimum: 0, maximum: 100 }
        band:
          enum: [PRIORITY_GROWTH_AREA, DEVELOPING, AGE_APPROPRIATE, STRONG, EXCEPTIONAL]
        bandLabel: { type: string }
        message: { type: string }
    GrowScoreReport:
      type: object
      required:
        - assessment
        - child
        - growScore
        - scoreBand
        - scoreBandLabel
        - skills
        - strengths
        - recommendedFocusAreas
        - entitlements
      properties:
        assessment: { type: object, additionalProperties: true }
        child: { type: object, additionalProperties: true }
        growScore: { type: number, minimum: 0, maximum: 100 }
        scoreBand:
          enum: [PRIORITY_GROWTH_AREA, DEVELOPING, AGE_APPROPRIATE, STRONG, EXCEPTIONAL]
        scoreBandLabel: { type: string }
        skills:
          type: array
          items: { $ref: "#/components/schemas/GrowScoreSkill" }
        strengths:
          type: array
          maxItems: 3
          items: { $ref: "#/components/schemas/GrowScoreSkill" }
        recommendedFocusAreas:
          type: array
          maxItems: 3
          items: { $ref: "#/components/schemas/GrowScoreSkill" }
        entitlements:
          type: object
          required: [visibleSkillCount, lockedSkillCount, planId]
          properties:
            visibleSkillCount: { type: integer }
            lockedSkillCount: { type: integer }
            planId: { enum: [PLN001, PLN002, PLN003] }
    JourneyMission:
      type: object
      required: [id, skillId, name, description, difficulty, durationMinutes, parentGuidance, childInstructions]
      properties:
        id: { type: string }
        skillId: { type: string }
        name: { type: string }
        description: { type: string }
        difficulty: { enum: [EASY, MEDIUM, HARD] }
        durationMinutes: { type: integer, minimum: 1 }
        materialsNeeded: { type: string }
        parentGuidance: { type: string }
        childInstructions: { type: string }
        learningOutcome: { type: string }
        points: { type: integer, minimum: 0 }
        indoorOutdoor: { enum: [INDOOR, OUTDOOR, BOTH] }
        category: { type: string }
    JourneyView:
      type: object
      required: [journey, child, progress, schedules, today, reassessment]
      properties:
        journey:
          type: object
          required: [id, childId, status, currentDay, missionsPlanned, completionPercent, reassessmentUnlocked]
          properties:
            id: { type: string }
            childId: { type: string }
            status: { enum: [Active, Paused, Completed] }
            currentDay: { type: integer, minimum: 1 }
            missionsPlanned: { type: integer, minimum: 1 }
            missionsCompleted: { type: integer, minimum: 0 }
            completionPercent: { type: number, minimum: 0, maximum: 100 }
            reassessmentUnlocked: { type: boolean }
        child: { type: object, additionalProperties: true }
        progress: { type: object, additionalProperties: true }
        schedules:
          type: array
          items: { type: object, additionalProperties: true }
        today:
          type: [object, "null"]
          properties:
            scheduleId: { type: string }
            day: { type: integer }
            week: { type: integer }
            reason: { type: array, items: { type: string } }
            mission: { $ref: "#/components/schemas/JourneyMission" }
        reassessment: { type: object, additionalProperties: true }
    WeeklyJourneySummary:
      type: object
      required: [journeyId, week, days, completed, completionPercent, totalPoints, averageEnjoyment, streak, message]
      properties:
        journeyId: { type: string }
        week: { type: integer, minimum: 1, maximum: 3 }
        days: { type: integer, const: 7 }
        completed: { type: integer, minimum: 0, maximum: 7 }
        completionPercent: { type: number, minimum: 0, maximum: 100 }
        totalPoints: { type: integer, minimum: 0 }
        averageEnjoyment: { type: number, minimum: 1, maximum: 5 }
        mostPracticedSkill: { type: [object, "null"], additionalProperties: true }
        streak: { type: integer, minimum: 0 }
        message: { type: string }
    ChildProgressView:
      type: object
      required:
        - child
        - entitlements
        - assessmentSnapshot
        - activitySnapshot
        - skillTrends
        - assessmentHistory
        - actions
      properties:
        child:
          type: object
          required: [id, name]
          properties:
            id: { type: string }
            name: { type: string }
            nickname: { type: [string, "null"] }
        entitlements:
          $ref: "#/components/schemas/ProgressEntitlements"
        assessmentSnapshot:
          $ref: "#/components/schemas/AssessmentProgressSnapshot"
        activitySnapshot:
          $ref: "#/components/schemas/MissionActivitySnapshot"
        skillTrends:
          type: array
          items: { $ref: "#/components/schemas/SkillProgressTrend" }
        assessmentHistory:
          type: array
          items: { $ref: "#/components/schemas/AssessmentHistoryItem" }
        actions:
          type: object
          required: [canReassess, canStartJourney, nextAction]
          properties:
            canReassess: { type: boolean }
            canStartJourney: { type: boolean }
            nextAction:
              enum: [DEVELOPMENT_CHECK, START_JOURNEY, CONTINUE_JOURNEY, REASSESS, VIEW_PROGRESS]
    ProgressEntitlements:
      type: object
      required:
        - planId
        - planName
        - growthTrackerEnabled
        - assessmentHistoryAccess
        - assessmentComparison
        - advancedAnalyticsEnabled
      properties:
        planId: { enum: [PLN001, PLN002, PLN003] }
        planName: { type: string }
        growthTrackerEnabled: { type: boolean }
        assessmentHistoryAccess: { enum: [Latest Only, Full] }
        assessmentComparison: { enum: [None, Latest vs Previous, Full History] }
        advancedAnalyticsEnabled: { type: boolean }
    AssessmentProgressSnapshot:
      type: object
      required:
        - latestAssessmentId
        - latestGrowScore
        - previousGrowScore
        - changeFromPrevious
        - completedAt
        - scoreBand
        - comparisonAvailable
        - message
      properties:
        latestAssessmentId: { type: [string, "null"] }
        latestGrowScore: { type: [number, "null"], minimum: 0, maximum: 100 }
        previousGrowScore: { type: [number, "null"], minimum: 0, maximum: 100 }
        changeFromPrevious: { type: [number, "null"] }
        completedAt: { type: [string, "null"], format: date-time }
        scoreBand:
          type: [string, "null"]
          enum: [PRIORITY_GROWTH_AREA, DEVELOPING, AGE_APPROPRIATE, STRONG, EXCEPTIONAL, null]
        comparisonAvailable: { type: boolean }
        message: { type: string }
    MissionActivitySnapshot:
      type: object
      required:
        - journeyId
        - status
        - missionsPlanned
        - missionsCompleted
        - completionPercent
        - streak
        - points
      properties:
        journeyId: { type: [string, "null"] }
        status: { enum: [Not Started, Active, Paused, Completed] }
        missionsPlanned: { type: integer, minimum: 0 }
        missionsCompleted: { type: integer, minimum: 0 }
        completionPercent: { type: number, minimum: 0, maximum: 100 }
        streak: { type: integer, minimum: 0 }
        points: { type: integer, minimum: 0 }
    SkillProgressTrend:
      type: object
      required: [skillId, name, colour, latestScore, changeFromPrevious, points]
      properties:
        skillId: { type: string }
        name: { type: string }
        colour: { type: string }
        latestScore: { type: number, minimum: 0, maximum: 100 }
        changeFromPrevious: { type: [number, "null"] }
        points:
          type: array
          items:
            type: object
            required: [assessmentId, sequence, completedAt, score]
            properties:
              assessmentId: { type: string }
              sequence: { type: integer, minimum: 1 }
              completedAt: { type: [string, "null"], format: date-time }
              score: { type: number, minimum: 0, maximum: 100 }
    AssessmentHistoryItem:
      type: object
      required:
        - assessmentId
        - sequence
        - completedAt
        - growScore
        - scoreBand
        - changeFromPrevious
        - journey
      properties:
        assessmentId: { type: string }
        sequence: { type: integer, minimum: 1 }
        completedAt: { type: [string, "null"], format: date-time }
        growScore: { type: [number, "null"], minimum: 0, maximum: 100 }
        scoreBand: { type: [string, "null"] }
        changeFromPrevious: { type: [number, "null"] }
        journey: { type: [object, "null"], additionalProperties: true }
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string }
            details: { type: array }
